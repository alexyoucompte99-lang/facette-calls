name: Relevé des appels

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: releve
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q cryptography
      - name: Lire le dashboard et chiffrer
        env:
          FACETTE_CODE: ${{ secrets.FACETTE_CODE }}
        run: python releve.py
      - name: Publier
        run: |
          git config user.name "releve-facette"
          git config user.email "releve@users.noreply.github.com"
          git add data/appels.enc
          if git diff --cached --quiet; then
            echo "rien de nouveau"
          else
            git commit -m "Relevé des appels"
            git pull --rebase
            git push
          fi
